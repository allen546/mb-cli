name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python in pyproject.toml (">=3.10").
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --group dev

      - name: Run tests
        run: .venv/bin/python -m pytest -q

  build:
    name: Build & validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: twine check
        run: uvx twine check dist/*

      - name: Assert sdist ships only intended files
        # Regression guard for the packaging bug where the sdist shipped a
        # nested copy of the repo from .claude/worktrees/ (76 of 153 entries).
        #
        # The distribution name is derived from pyproject rather than hardcoded,
        # so a future rename cannot silently leave this asserting the old one.
        # The two names used to differ, which is exactly how a hardcoded
        # assertion went stale unnoticed; they are the same as of 0.4.2.
        # The sdist root directory is `<name>-<version>/` by PEP 517/625 convention.
        # Read with sed rather than tomllib, which is 3.11+ while the floor is
        # 3.10 — the build job pins 3.12, but a name lookup has no business
        # depending on the interpreter version.
        run: |
          set -euo pipefail
          sdist=$(ls dist/*.tar.gz)
          entries=$(tar tzf "$sdist")

          dist_name=$(sed -nE 's/^name[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' pyproject.toml | head -1)
          if [ -z "$dist_name" ]; then
            echo "::error::could not read [project].name from pyproject.toml"
            exit 1
          fi
          echo "distribution name: $dist_name"

          forbidden=('\.claude' '\.pyc' '__pycache__' 'docs/superpowers' '/\.git/')
          fail=0
          for pat in "${forbidden[@]}"; do
            n=$(printf '%s\n' "$entries" | grep -c "$pat" || true)
            if [ "$n" -ne 0 ]; then
              echo "::error::sdist contains $n forbidden entries matching '$pat'"
              printf '%s\n' "$entries" | grep "$pat" | head -20
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

          for required in "${dist_name}-.*/src/tahuti/__init__.py" \
                          "${dist_name}-.*/README.md" \
                          "${dist_name}-.*/LICENSE" \
                          "${dist_name}-.*/pyproject.toml"; do
            if ! printf '%s\n' "$entries" | grep -qE "$required"; then
              echo "::error::sdist is missing a required file matching '$required'"
              exit 1
            fi
          done
          echo "sdist OK: $(printf '%s\n' "$entries" | wc -l) entries"

      - name: Assert wheel contains the package and metadata
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl)
          names=$(unzip -Z1 "$wheel")

          # The import package and the distribution (and therefore the
          # dist-info directory) are both `tahuti`. Asserting the package
          # contents independently of the dist-info name is what catches a
          # rename that changes one without the other.
          printf '%s\n' "$names" | grep -q '^tahuti/__init__.py$' \
            || { echo "::error::wheel is missing tahuti/__init__.py"; exit 1; }
          printf '%s\n' "$names" | grep -qE '^tahuti-[0-9.]+\.dist-info/METADATA$' \
            || { echo "::error::wheel is missing dist-info METADATA"; exit 1; }
          printf '%s\n' "$names" | grep -qE '^tahuti-[0-9.]+\.dist-info/entry_points\.txt$' \
            || { echo "::error::wheel is missing dist-info entry_points.txt"; exit 1; }

          junk=$(printf '%s\n' "$names" | grep -cE '\.pyc$|__pycache__/|^tests/|^docs/|^extras/' || true)
          if [ "$junk" -ne 0 ]; then
            echo "::error::wheel contains $junk unexpected entries"
            exit 1
          fi
          echo "wheel OK: $(printf '%s\n' "$names" | grep -c . ) files"
