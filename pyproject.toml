[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mb-cli"
version = "0.3.0"
description = "Crawl ManageBac tasks, grades & submission states"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Allen" }]
keywords = ["managebac", "crawler", "scraper", "tasks", "grades"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
]

# Upper bound is required: mcp 2.x renamed FastMCP to MCPServer and removed
# mcp.server.fastmcp, which mcp_server.py imports. Without <2 a fresh resolve
# installs mcp 2.x and every `mb-mcp` invocation dies on import.
[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]

# Development-only dependencies. Deliberately *not* optional-dependency
# extras: nothing here belongs in a published runtime environment.
# - requests-mock is imported by tests but was previously undeclared, so a
#   plain `uv sync` could never run the suite.
# - mcp is the [mcp] extra; pulled in here because tests/test_mcp_server.py
#   imports it unconditionally.
[dependency-groups]
dev = [
    "pytest>=8",
    "requests-mock>=1.12",
    "mcp>=1.20,<2",
]

[project.scripts]
mb = "mb_cli.__main__:main"
mb-mcp = "mb_cli.mcp_server:main"

[project.urls]
Homepage = "https://github.com/allen/mb-crawler"

[tool.pytest.ini_options]
testpaths = ["tests"]

# ── Packaging ────────────────────────────────────────────────────────────
# Hatchling's sdist default is "everything git does not ignore", which once
# shipped a 75 MB nested worktree clone from .claude/worktrees/ (76 of the
# 152 sdist entries). The include list below pins exactly what ships so this
# cannot regress; the excludes are belt-and-braces on top of .gitignore.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/extras",
    "/docs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/pyproject.toml",
]
exclude = [
    # Agent/tooling scratch space — .claude/worktrees/ holds full repo clones.
    "/.claude",
    "/.worktrees",
    # Build and environment noise.
    "/dist",
    "/build",
    "/.venv",
    "*.egg-info",
    # Internal design/planning artifacts; kept in the repo but not shipped.
    "/docs/superpowers",
    "/docs/deployments",
    # Working notes, not user-facing documentation.
    "/SPEC.md",
    "/use_case.md",
    # Never ship bytecode.
    "**/__pycache__",
    "*.pyc",
    "*.pyo",
]

[tool.hatch.build.targets.wheel]
packages = ["/src/mb_cli"]
